name: 手动发布文档到 GitHub Pages

# 仅在 Actions 页面点击 Run workflow 时运行；推送、PR 和定时任务均不触发。
# main 只需此发布入口；网站配置、文章和图片留在 docs/github-pages 分支。
# 首次使用前：仅将此文件合入 main，并在 Settings > Pages 中选择 GitHub Actions。
# 在 Actions 中选择 main 运行；实际构建固定读取 docs/github-pages 的最新提交。
# 此工作流不会修改文章、合并分支，或自动开启/修改 Pages 发布来源。
"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pages-manual
  cancel-in-progress: false

jobs:
  build:
    name: 检查并生成文档
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: 读取独立网站分支（不读取 main 的文章）
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/heads/docs/github-pages
          persist-credentials: false

      - name: 准备文档构建环境
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: 安装网站依赖（不安装或运行机器人实验）
        run: |
          python -m pip install -r docs/requirements.txt
          python -m pip check

      - name: 检查文档兼容层
        run: python -B -m unittest discover -s docs/_ext -v

      - name: 检查已启用的 GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false

      - name: 生成网页
        # 编辑页面及源码链接指向网站分支，不引导读者修改 main 的文章。
        # 保留原稿缺海报等警告，不使用 -W；真正的构建错误仍会终止发布。
        run: >-
          python -m sphinx -E -a -b html
          -D html_theme_options.repository_branch=docs/github-pages
          -d docs/_build/doctrees
          -w docs/_build/pages-warnings.log
          docs docs/_build/html

      - name: 上传生成的网页（不上传整个仓库）
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/_build/html

  deploy:
    name: 发布到 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布网页
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
