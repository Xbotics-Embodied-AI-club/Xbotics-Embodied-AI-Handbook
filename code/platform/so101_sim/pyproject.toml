# so101_sim —— SO101 ManiSkill3 仿真环境，作可 import 的 editable 依赖包。
# 由 experiments 顶层 pyproject 的 [tool.uv.sources] 以 editable 装入统一 uv 环境；
# 运行依赖（mani_skill / torch / gymnasium）由所选 extra（gpu_x86）提供，本包不重复声明。
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "so101_sim"
version = "0.0.1"
description = "SO101 ManiSkill3 仿真环境：原生批量入口 + lerobot 评测口"
requires-python = ">=3.12,<3.13"

# 仿真资产（URDF / 网格 / 贴图）随 packages 一起进 wheel —— hatchling 收整个包目录，
# 不只收 .py，所以不需要再单独声明一遍；重复声明会让同一路径被写入两次而构建失败。
[tool.hatch.build.targets.wheel]
packages = ["so101_sim"]
