[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pose-driven-pick-place"
version = "0.1.0"
description = "Teaching implementation of a pose-driven pick-and-place state machine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
maniskill = ["numpy>=1.24"]

[project.scripts]
pick-place-demo = "robot_pick_place.run_demo:main"

[tool.setuptools.packages.find]
include = ["robot_pick_place*"]
