70" y="413" class="m" text-anchor="middle">判断证据</text><text x="1170" y="457" class="s" text-anchor="middle">支持 / 否定 / 不充分</text><line x1="1283" y1="417" x2="1312" y2="417" stroke="#1F6FEB" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="1320" y="325" width="210" height="185" rx="22" fill="#FFFFFF" stroke="#55738E" stroke-width="3" filter="url(#shadow)"/><text x="1425" y="370" class="s" text-anchor="middle">06</text><text x="1425" y="413" class="m" text-anchor="middle">决定下一步</text><text x="1425" y="457" class="s" text-anchor="middle">复现或新实验</text><path d="M1435 535 C1435 710, 150 710, 150 535" fill="none" stroke="#55738E" stroke-width="4" stroke-dasharray="13 10" marker-end="url(#arrow-dark)"/><text x="800" y="690" class="b" text-anchor="middle">现象 → 最早异常 → 候选原因 → 单变量验证 → 改进</text><rect x="365" y="180" width="870" height="48" rx="24" fill="#EAF3FF" stroke="#1F6FEB" stroke-width="2"/><text x="800" y="212" class="b" font-weight="700" text-anchor="middle">最小复现记录：软件/资产版本 + seed + 两个时钟 + 初始状态 + 指标</text></svg>