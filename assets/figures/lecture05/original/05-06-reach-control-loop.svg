<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#1F6FEB"/>
    </marker>
    <marker id="arrow-dark" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#55738E"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#123B64" flood-opacity="0.12"/>
    </filter>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172B3A; }
      .title { font-size: 42px; font-weight: 700; letter-spacing: 1px; }
      .subtitle { font-size: 21px; fill: #5B6B7A; }
      .h { font-size: 27px; font-weight: 700; }
      .m { font-size: 23px; font-weight: 600; }
      .b { font-size: 20px; }
      .s { font-size: 17px; fill: #5B6B7A; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 18px; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="0" y="0" width="18" height="900" fill="#1F6FEB"/>
  <text x="70" y="72" class="title">SO-101 Reach 闭环</text>
  <text x="72" y="108" class="subtitle">目标位置不直接驱动电机：必须经过误差、Jacobian、IK 与执行器</text>
  <line x1="70" y1="130" x2="1530" y2="130" stroke="#A9BED1" stroke-width="2"/><rect x="70" y="330" width="205" height="150" rx="22" fill="#FFFFFF" stroke="#55738E" stroke-width="3" filter="url(#shadow)"/><text x="172.5" y="378" class="m" text-anchor="middle">目标位置</text><text x="172.5" y="418" class="b" text-anchor="middle"><tspan x="172.5" dy="0">x*</tspan><tspan x="172.5" dy="28">世界坐标</tspan></text><line x1="287" y1="405" x2="308" y2="405" stroke="#1F6FEB" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="320" y="330" width="215" height="150" rx="22" fill="#FFFFFF" stroke="#55738E" stroke-width="3" filter="url(#shadow)"/><text x="427.5" y="378" class="m" text-anchor="middle">位置误差</text><text x="427.5" y="418" class="b" text-anchor="middle"><tspan x="427.5" dy="0">e = x* − x</tspan><tspan x="427.5" dy="28">每个控制周期</tspan></text><line x1="547" y1="405" x2="568" y2="405" stroke="#1F6FEB" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="580" y="330" width="265" height="150" rx="22" fill="#EAF3FF" stroke="#1F6FEB" stroke-width="3" filter="url(#shadow)"/><text x="712.5" y="378" class="m" text-anchor="middle">阻尼最小二乘 IK</text><text x="712.5" y="418" class="s" text-anchor="middle"><tspan x="712.5" dy="0">Δq = Jᵀ(JJᵀ+λ²I)⁻¹e</tspan><tspan x="712.5" dy="28">关节增量限幅</tspan></text><line x1="857" y1="405" x2="878" y2="405" stroke="#1F6FEB" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="890" y="330" width="220" height="150" rx="22" fill="#FFFFFF" stroke="#55738E" stroke-width="3" filter="url(#shadow)"/><text x="1000" y="378" class="m" text-anchor="middle">关节目标</text><text x="1000" y="418" class="b" text-anchor="middle"><tspan x="1000" dy="0">qcmd = clip(q+Δq)</tspan><tspan x="1000" dy="28">写入 data.ctrl</tspan></text><line x1="1122" y1="405" x2="1143" y2="405" stroke="#1F6FEB" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="1155" y="330" width="205" height="150" rx="22" fill="#FFFFFF" stroke="#55738E" stroke-width="3" filter="url(#shadow)"/><text x="1257.5" y="378" class="m" text-anchor="middle">物理推进</text><text x="1257.5" y="418" class="b" text-anchor="middle"><tspan x="1257.5" dy="0">mj_step</tspan><tspan x="1257.5" dy="28">5 ms / step</tspan></text><line x1="1372" y1="405" x2="1388" y2="405" stroke="#1F6FEB" stroke-width="4" marker-end="url(#arrow-blue)"/><rect x="1400" y="330" width="150" height="150" rx="22" fill="#FFFFFF" stroke="#55738E" stroke-width="3" filter="url(#shadow)"/><text x="1475" y="378" class="m" text-anchor="middle">新观测</text><text x="1475" y="418" class="b" text-anchor="middle"><tspan x="1475" dy="0">q, q̇, x</tspan><tspan x="1475" dy="28">记录日志</tspan></text><path d="M1475 505 C1475 700, 420 720, 420 505" fill="none" stroke="#55738E" stroke-width="4" stroke-dasharray="13 9" marker-end="url(#arrow-dark)"/><text x="930" y="695" class="b" text-anchor="middle">反馈：新末端位置进入下一次误差计算</text><rect x="230" y="185" width="250" height="48" rx="24" fill="#EAF3FF" stroke="#1F6FEB" stroke-width="2"/><text x="355" y="217" class="b" font-weight="700" text-anchor="middle">物理步长 5 ms</text><rect x="675" y="185" width="250" height="48" rx="24" fill="#EAF3FF" stroke="#1F6FEB" stroke-width="2"/><text x="800" y="217" class="b" font-weight="700" text-anchor="middle">控制周期 20 ms</text><rect x="1120" y="185" width="250" height="48" rx="24" fill="#EAF3FF" stroke="#1F6FEB" stroke-width="2"/><text x="1245" y="217" class="b" font-weight="700" text-anchor="middle">成功：误差保持达标</text></svg>