="664" class="b" text-anchor="start">高增益下失稳</text><rect x="1135" y="618" width="390" height="76" rx="10" fill="#F6FAFF" stroke="#A9BED1" stroke-width="1.5"/><text x="1155" y="664" class="b" text-anchor="start">接口对齐与延迟建模</text><rect x="65" y="710" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#A9BED1" stroke-width="1.5"/><text x="165" y="756" class="m" text-anchor="middle">视觉域</text><rect x="285" y="710" width="470" height="76" rx="10" fill="#FFFFFF" stroke="#A9BED1" stroke-width="1.5"/><text x="305" y="756" class="b" text-anchor="start">纹理、光照、深度理想</text><rect x="775" y="710" width="340" height="76" rx="10" fill="#FFFFFF" stroke="#A9BED1" stroke-width="1.5"/><text x="795" y="756" class="b" text-anchor="start">检测/位姿误差</text><rect x="1135" y="710" width="390" height="76" rx="10" fill="#FFFFFF" stroke="#A9BED1" stroke-width="1.5"/><text x="1155" y="756" class="b" text-anchor="start">域随机化与适配</text><text x="800" y="850" class="b" text-anchor="middle">方法不是越多越好：每一种措施都应对应一个已经观察到或准备验证的错误假设</text></svg>