  <text x="72" y="108" class="subtitle">先把真实任务写成可执行约定，再打开仿真器</text>
  <line x1="70" y1="130" x2="1530" y2="130" stroke="#A9BED1" stroke-width="2"/><circle cx="800" cy="445" r="155" fill="#123B64"/><text x="800" y="420" class="h" text-anchor="middle" style="fill:#FFFFFF"><tspan x="800" dy="0">可复盘的</tspan><tspan x="800" dy="43">仿真实验</tspan></text><text x="800" y="505" class="s" text-anchor="middle" style="fill:#DDEBFA">可控 · 可测 · 可重复 · 可解释</text><rect x="140" y="195" width="300" height="112" rx="22" fill="#F6FAFF" stroke="#1F6FEB" stroke-width="3" filter="url(#shadow)"/><circle cx="183" cy="233" r="23" fill="#1F6FEB"/><text x="183" y="241" class="b" text-anchor="middle" style="fill:#FFFFFF" font-weight="700">1</text><text x="220" y="240" class="m">目标</text><text x="168" y="278" class="s">机器人要完成什么</text><line x1="347.9490326821839" y1="273.04335753008564" x2="637.3688437629032" y2="383.1363837058887" stroke="#55738E" stroke-width="3" stroke-dasharray="12 10" marker-end="url(#arrow-dark)"/><rect x="520" y="165" width="300" height="112" rx="22" fill="#FFFFFF" stroke="#55738E" stroke-width="3" filter="url(#shadow)"/><circle cx="563" cy="203" r="23" fill="#123B64"/><text x="563" y="211" class="b" text-anchor="middle" style="fill:#FFFFFF" font-weight="700">2</text><text x="600" y="210" class="m">模型</text><text x="548" y="248" class="s">身体与执行器是什么</text><line x1="701.1208509649118" y1="274.62362012415565" x2="712.6608376146024" y2="294.5079048128535" stroke="#55738E" stroke-width="3" stroke-dasharray="12 10" marker-end="url(#arrow-dark)"/><rect x="900" y="195" width="300" height="112" rx="22" fill="#F6FAFF" stroke="#1F6FEB" stroke-width="3" filter="url(#shadow)"/><circle cx="943" cy="233" r="23" fill="#1F6FEB"/><text x="943" y="241" class="b" text-anchor="middle" style="fill:#FFFFFF" font-weight="700">3</text><text x="980" y="240" class="m">场景</text><text x="928" y="278" class="s">世界里有哪些对象</text><line x1="1001.0179927153978" y1="289.01003765285134" x2="937.4656333471095" y2="338.32666852264305" stroke="#55738E" stroke-width="3" stroke-dasharray="12 10" marker-end="url(#arrow-dark)"/><rect x="1115" y="400" width="300" height="112" rx="22" fill="#FFFFFF" stroke="#55738E" stroke-width="3" filter="url(#shadow)"/><circle cx="1158" cy="438" r="23" fill="#123B64"/><text x="1158" y="446" class="b" text-anchor="middle" style="fill:#FFFFFF" font-weight="700">4</text><text x="1195" y="445" class="m">观测</text><text x="1143" y="483" class="s">控制器能够读取什么</text><line x1="1203.017340392798" y1="454.5337435361737" x2="973.9513350266641" y2="449.11497781783504" stroke="#55738E" stroke-width="3" stroke-dasharray="12 10" marker-end="url(#arrow-dark)"/><rect x="900" y="610" width="300" height="112" rx="22" fill="#F6FAFF" stroke="#1F6FEB" stroke-width="3" filter="url(#shadow)"/><circle cx="943" cy="648" r="23" fill="#1F6FEB"/><text x="943" y="656" class="b" text-anchor="middle" style="fill:#FFFFFF" font-weight="700">5</text><text x="980" y="655" class="m">动作</text><text x="928" y="693" class="s">指令以什么口径下发</text><line x1="1003.5480297326992" y1="624.9364582837061" x2="930.3652068791989" y2="560.2428428812118" stroke="#55738E" stroke-width="3" stroke-dasharray="12 10" marker-end="url(#arrow-dark)"/><rect x="455" y="640" width="360" height="112" rx="22" fill="#FFFFFF" stroke="#55738E" stroke-width="3" filter="url(#shadow)"/><circle cx="498" cy="678" r="23" fill="#123B64"/><text x="498" y="686" class="b" text-anchor="middle" style="fill:#FFFFFF" font-weight="700">6</text><text x="535" y="685" class="m">物理与控制</text><text x="483" y="723" class="s">世界怎样推进、控制怎样更新</text><line x1="669.057266021062" y1="644.1916741134148" x2="704.4199308441164" y2="590.397559746223" stroke="#55738E" stroke-width="3" stroke-dasharray="12 10" marker-end="url(#arrow-dark)"/><rect x="120" y="560" width="300" height="112" rx="22" fill="#F6FAFF" stroke="#1F6FEB" stroke-width="3" filter="url(#shadow)"/><circle cx="163" cy="598" r="23" fill="#1F6FEB"/><text x="163" y="606" class="b" text-anchor="middle" style="fill:#FFFFFF" font-weight="700">7</text><text x="200" y="605" class="m">判定</text><text x="148" y="643" class="s">成功、失败与超时怎样区分</text><line x1="329.0048849186442" y1="596.9625748658714" x2="634.4056455509017" y2="498.42761247319964" stroke="#55738E" stroke-width="3" stroke-dasharray="12 10" marker-end="url(#arrow-dark)"/></svg>